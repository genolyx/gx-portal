server {
    listen 80;
    server_name _;

    # GX contract — accepted immediately; keep a long timeout for send-report
    location /api/v1/ {
        proxy_pass         http://api:4000/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 50m;
    }

    # External Create Order (FASTQ URL download can take a long time)
    location /api/external/ {
        proxy_pass         http://api:4000/external/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 50m;
    }

    # Browser FASTQ upload — stream through; files are often many GB
    location /api/browse/fastq/upload {
        proxy_pass         http://api:4000/browse/fastq/upload;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_request_buffering off;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        client_max_body_size 0;
    }

    # NestJS API — /api/* → strip /api prefix and proxy to NestJS
    location /api/ {
        proxy_pass         http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 120s;
    }

    # Next.js frontend — everything else
    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
    }
}
